[package]
name = "hearing_test"
version = "0.1.0"
edition = "2024"
description = "An offline, uncalibrated personal hearing trend tracker"

[dependencies]
cpal = "0.18.1"
crossbeam-channel = "0.5.15"
directories = "6.0.0"
eframe = "0.35.0"
printpdf = { version = "0.12.5", default-features = false }
rand = "0.9.2"
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
time = { version = "0.3.54", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"
